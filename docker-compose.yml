version: "3.8"

services:
  soc-detection-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc-detection-lab
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      - ./rules:/app/rules:ro
      - ./datasets:/app/datasets:ro
      - ./reports:/app/reports
      - ./evaluation/results:/app/evaluation/results
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
